<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Home Customizer</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <h1>webOS Home Customizer</h1>
  <div id="status">Checking current state&hellip;</div>

  <h2>Layouts</h2>
  <div class="grid" id="presetGrid">
    <button class="tile" data-preset="full" tabindex="0">
      <span class="tileTitle">Full banner</span>
      <span class="tileDesc">Fullscreen hero banner, nav icons hidden</span>
    </button>
    <button class="tile" data-preset="compact" tabindex="0">
      <span class="tileTitle">Compact</span>
      <span class="tileDesc">Nav icons kept, tighter gap to the app row</span>
    </button>
  </div>

  <h2>Other</h2>
  <button class="wide" id="restoreBtn" tabindex="0">Restore stock home screen</button>

  <div id="loading" style="display:none;">
    <span id="loadText">Working&hellip;</span>
  </div>

  <details id="details">
    <summary tabindex="0">Log</summary>
    <pre id="log"></pre>
  </details>
</div>
<script src="js/app.js"></script>
</body>
</html>
